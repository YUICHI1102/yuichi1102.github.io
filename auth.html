<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Genji Uploader — Authorization</title>
<style>body{font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#f7f4ec;color:#222}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:32px;max-width:520px;text-align:center}code{display:block;font-size:20px;word-break:break-all;background:#f0ede3;padding:16px;border-radius:8px;margin:16px 0}button{font-size:16px;padding:10px 20px;border:0;border-radius:8px;background:#2f5240;color:#fff;cursor:pointer}</style>
</head>
<body>
<div class="card" id="card"><h1>Genji Uploader — Authorization</h1><p id="msg">Reading the authorization result…</p></div>
<script>
(function(){
  var p = new URLSearchParams(location.search);
  var card = document.getElementById('card');
  var err = p.get('error');
  if (err) {
    card.innerHTML = '<h1>Authorization failed</h1><p>' + err + '</p>' + (p.get('error_description') ? '<p>' + p.get('error_description') + '</p>' : '');
    return;
  }
  var code = p.get('code');
  if (!code) {
    card.innerHTML = '<h1>Genji Uploader — Authorization</h1><p>No authorization code was found in this link.</p>';
    return;
  }
  card.innerHTML = '<h1>Authorization complete</h1><p>Give this code to the operator to finish connecting the account.</p><code id="c"></code><button id="b">Copy code</button>';
  document.getElementById('c').textContent = code;
  document.getElementById('b').addEventListener('click', function(){
    navigator.clipboard.writeText(code).then(function(){ document.getElementById('b').textContent = 'Copied'; });
  });
})();
</script>
</body>
</html>
